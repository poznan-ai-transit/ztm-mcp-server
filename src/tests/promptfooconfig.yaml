# Testy agenta ZTM Poznan.
#
# Uruchomienie (z src/tests):
#   npx promptfoo eval --no-cache -o results.json
#   npx promptfoo eval --no-cache --repeat 5 -o results.json
#   node failures.js results.json
#
# Scenariusze sa podzielone wedlug kategorii w katalogu scenarios/.

providers:
  - id: openrouter:anthropic/claude-haiku-5.5
    config:
      apiKey: '{{env.OPENROUTER_API_KEY}}'
      mcp:
        enabled: true
        server:
          url: http://localhost:8000/mcp
  - id: openrouter:google/gemini-2.5-flash-lite
    config:
      apiKey: '{{env.OPENROUTER_API_KEY}}'
      mcp:
        enabled: true
        server:
          url: http://localhost:8000/mcp
  - id: openrouter:meta-llama/llama-3.1-8b-instruct
    config:
      apiKey: '{{env.OPENROUTER_API_KEY}}'
      mcp:
        enabled: true
        server:
          url: http://localhost:8000/mcp

prompts:
  - |
    [
      {"role": "system", "content": "You are an assistant for public transport in Poznan (ZTM Poznan) ONLY. Rules: 1) For stop-existence questions, use search_stops. For route-existence questions, use search_routes. Never answer these from memory. 2) For departure questions, use get_departures. If the tool requires a stop identifier, first resolve the stop with search_stops, then call get_departures with the returned identifier; do not stop after resolving the stop. 3) If the city is not stated, assume Poznan. 4) If the question concerns a place outside Poznan, or is not about Poznan public transport, politely decline and do NOT call any tool. 5) If required information is missing, ask for the missing information and do NOT call a tool that cannot be used without it. A clarification may be phrased as a request and does not need to end with a question mark. 6) If a tool returns no results, say so; never invent stops, routes or times. 7) Never invent departure times; only report times returned by get_departures. Reply in the language the user writes in."},
      {"role": "user", "content": {{ question | dump }}}
    ]

evaluateOptions:
  maxConcurrency: 1

tests: scenarios/*.yaml
