# Mode 2: hard cases (nonexistent stop, missing details, out-of-range date).
# Test data: see the header of 01-chains.yaml.
# M7 (bare stop name, all same-name platforms) is removed until stop groups land (#60-#61).

- description: M4 Nonexistent stop - no departures call, no invented data
  metadata: { mode: 2 }
  vars:
    question: 'Show departures of line 15 from stop Plac Nieistniejacy Xyz on 2026-11-24 at 12:00.'
  assert:
    - type: javascript
      value: file://../lib/assertions.js:noDeparturesCall
    - type: javascript
      value: context.providerResponse.metadata.toolCalls.some(c => c.name === 'search_stops')
    - type: llm-rubric
      value: The agent says it could not find such a stop and gives no departure times.

- description: M5 Two lines at one stop - two get_departures calls
  metadata: { mode: 2 }
  vars:
    question: 'Compare departures of lines 15 and 11 from stop Rondo Kaponiera, platform RKAP72, on 2026-11-24 at 12:00.'
  assert:
    - type: javascript
      value: |
        // Two get_departures calls with different route_ids.
        const d = context.providerResponse.metadata.toolCalls.filter(c => c.name === 'get_departures');
        return d.length >= 2 && new Set(d.map(x => String(x.args.route_id))).size >= 2;
    - type: javascript
      value: file://../lib/assertions.js:idsFromSearch
    - type: javascript
      value: file://../lib/assertions.js:noInventedTimes

- description: M6 Route existence, then departures
  metadata: { mode: 2 }
  vars:
    question: 'Does line 15 exist, and if so when does it leave stop Rondo Kaponiera, platform RKAP72, on 2026-11-24 at 12:00?'
  assert:
    - type: javascript
      value: |
        const n = context.providerResponse.metadata.toolCalls.map(c => c.name);
        return n.includes('search_routes') && n.includes('search_stops') && n.includes('get_departures');
    - type: javascript
      value: file://../lib/assertions.js:idsFromSearch
    - type: javascript
      value: file://../lib/assertions.js:noInventedTimes

- description: M8 Missing date and time - asks instead of calling get_departures
  metadata: { mode: 2 }
  vars:
    question: 'Show departures of line 15 from stop Rondo Kaponiera, platform RKAP72.'
  assert:
    - type: javascript
      value: file://../lib/assertions.js:noDeparturesCall
    - type: llm-rubric
      value: The agent asks for the missing date and/or time and does not invent departure times.

- description: M9 Date outside the dataset - reports the error honestly
  metadata: { mode: 2 }
  vars:
    question: 'Show departures of line 15 from stop Rondo Kaponiera, platform RKAP72, on 2026-12-24 at 12:00.'
  assert:
    - type: javascript
      value: file://../lib/assertions.js:noInventedTimes
    - type: llm-rubric
      value: The agent says the date is outside the supported range (or that no data is available) and does not invent departure times.
