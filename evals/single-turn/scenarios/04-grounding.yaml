- description: D1 Existence question is verified with a tool
  vars:
    question: 'Czy istnieje przystanek Rondo Rataje?'
  assert:
    - type: contains
      metric: grounding
      value: 'search_stops'

- description: D2 A made-up stop is still checked with a tool
  vars:
    question: 'Check if a stop called "Zzxqv Nonexistent Street" exists.'
  assert:
    - type: contains
      metric: grounding
      value: 'search_stops'

- description: D3 Departure-time question is verified with a tool
  vars:
    question: 'What are the next scheduled departures from Rondo Kaponiera starting now?'
  assert:
    - type: javascript
      value: |
        const s = typeof output === 'string' ? output : JSON.stringify(output);
        return s.includes('get_departures') ||
               (s.includes('search_stops') && /kaponiera/i.test(s));
