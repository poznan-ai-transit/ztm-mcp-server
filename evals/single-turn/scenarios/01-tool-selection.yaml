- description: A1 EN stop -> search_stops
  vars:
    question: 'Check if a stop called "Rondo Kaponiera" exists.'
  assert:
    - type: contains
      metric: tool_selection
      value: 'search_stops'

- description: A2 EN route -> search_routes
  vars:
    question: 'Check if a route with a number 24 exists.'
  assert:
    - type: contains
      metric: tool_selection
      value: 'search_routes'

- description: A3 PL stop -> search_stops, not search_routes
  vars:
    question: 'Czy istnieje przystanek Rondo Kaponiera?'
  assert:
    - type: contains
      metric: tool_selection
      value: 'search_stops'
    - type: not-contains
      metric: tool_selection
      value: 'search_routes'

- description: A4 PL route -> search_routes, not search_stops
  vars:
    question: 'Czy istnieje linia numer 74?'
  assert:
    - type: contains
      metric: tool_selection
      value: 'search_routes'
    - type: not-contains
      metric: tool_selection
      value: 'search_stops'

- description: A5 A typo in the stop name still calls search_stops
  vars:
    question: 'Sprawdź przystanek "Kaponera".'
  assert:
    - type: contains
      metric: tool_selection
      value: 'search_stops'

- description: A6 Stop name is passed as a parameter
  vars:
    question: 'Czy istnieje przystanek Rataje?'
  assert:
    - type: contains
      metric: tool_selection
      value: 'search_stops'
    - type: icontains
      metric: tool_params
      value: 'Rataje'

- description: A7 Route number is passed as a parameter
  vars:
    question: 'Czy istnieje linia numer 74?'
  assert:
    - type: contains
      metric: tool_selection
      value: 'search_routes'
    - type: contains
      metric: tool_params
      value: '74'

- description: A8 Multi-word name is passed as a parameter
  vars:
    question: 'Check if a stop called "Rondo Kaponiera" exists.'
  assert:
    - type: icontains
      metric: tool_params
      value: 'Kaponiera'

- description: A9 A multi-step question calls both tools
  vars:
    question: 'Check whether a stop called "Rondo Kaponiera" exists and whether route 24 exists.'
  assert:
    - type: contains
      metric: tool_selection
      value: 'search_stops'
    - type: contains
      metric: tool_selection
      value: 'search_routes'

- description: A10 Explicitly specifying Poznan does not block the request
  vars:
    question: 'Check if a stop called "Dworzec Zachodni" exists in Poznań.'
  assert:
    - type: contains
      metric: tool_selection
      value: 'search_stops'

- description: A11 A question about upcoming departures calls get_departures
  vars:
    question: 'Show me the next scheduled departures from the Poznań stop Rondo Kaponiera, starting now.'
  assert:
    - type: javascript
      value: |
        const s = typeof output === 'string' ? output : JSON.stringify(output);
        return s.includes('get_departures') ||
              (s.includes('search_stops') && /kaponiera/i.test(s));
