<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-labelledby="title desc">
<title id="title">ZTM Poznań MCP use cases</title>
<desc id="desc">A commuter asks an AI assistant to find stops, lines, departures and journeys. The assistant combines journeys with external venue information to plan activities and café meetings. Static data refresh is implemented; live feeds are future work.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526173"/></marker></defs>
<rect width="1120" height="860" fill="white"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#203040">
<text x="40" y="42" font-size="25" font-weight="bold">ZTM Poznań MCP: session-based use cases</text>

<rect x="40" y="80" width="200" height="65" rx="12" fill="#fff" stroke="#526173"/>
<text x="56" y="107" font-size="16" font-weight="bold">Commuter / friends</text>
<text x="56" y="130" font-size="13">Natural language + follow-ups</text>
<rect x="300" y="80" width="210" height="65" rx="12" fill="#fff" stroke="#526173"/>
<text x="316" y="107" font-size="16" font-weight="bold">AI assistant</text>
<text x="316" y="130" font-size="13">Keeps conversation context</text>
<path d="M240 112L300 112" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="205" width="510" height="350" rx="12" fill="#F3FBF8" stroke="#0F6E56"/>
<text x="60" y="237" font-size="19" font-weight="bold">Implemented MCP: static timetables</text>
<rect x="60" y="260" width="470" height="64" rx="12" fill="#9FE1CB" stroke="#526173"/>
<text x="76" y="287" font-size="16" font-weight="bold">Find stops and platforms</text>
<text x="76" y="310" font-size="13">search_stops</text>
<rect x="60" y="330" width="470" height="64" rx="12" fill="#9FE1CB" stroke="#526173"/>
<text x="76" y="357" font-size="16" font-weight="bold">Find lines / lines at a stop</text>
<text x="76" y="380" font-size="13">search_routes / get_routes_for_stop</text>
<rect x="60" y="400" width="470" height="64" rx="12" fill="#9FE1CB" stroke="#526173"/>
<text x="76" y="427" font-size="16" font-weight="bold">Check scheduled departures</text>
<text x="76" y="450" font-size="13">get_departures</text>
<rect x="60" y="470" width="470" height="64" rx="12" fill="#9FE1CB" stroke="#526173"/>
<text x="76" y="497" font-size="16" font-weight="bold">Find journeys with a transfer limit</text>
<text x="76" y="520" font-size="13">search_connection</text>
<path d="M400 145L295 205" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="590" y="205" width="490" height="245" rx="12" fill="#F5F8FF" stroke="#526173"/>
<text x="610" y="237" font-size="19" font-weight="bold">Assistant workflows</text>
<rect x="610" y="260" width="450" height="65" rx="12" fill="#DCEBFF" stroke="#526173"/>
<text x="626" y="287" font-size="16" font-weight="bold">Plan activities between commitments</text>
<text x="626" y="310" font-size="13">Example: Politechnika → activity → Krauthofera</text>
<rect x="610" y="345" width="450" height="65" rx="12" fill="#DCEBFF" stroke="#526173"/>
<text x="626" y="372" font-size="16" font-weight="bold">Find a café reachable from two origins</text>
<text x="626" y="395" font-size="13">Example: Rondo Kaponiera + Politechnika</text>
<path d="M510 112L835 205" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M590 425L550 495" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="605" y="480" font-size="14">Uses scheduled journeys + external research</text>
<rect x="610" y="500" width="450" height="65" rx="12" fill="#fff" stroke="#526173"/>
<text x="626" y="527" font-size="16" font-weight="bold">Web / venue sources</text>
<text x="626" y="550" font-size="13">Opening hours; walking estimates are separate</text>
<path d="M835 450L835 500" fill="none" stroke="#526173" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="595" width="510" height="65" rx="12" fill="#9FE1CB" stroke="#526173"/>
<text x="56" y="622" font-size="16" font-weight="bold">Daily scheduler → refresh static GTFS</text>
<text x="56" y="645" font-size="13">Downloads a ZTM static GTFS snapshot</text>
<rect x="590" y="595" width="490" height="65" rx="12" fill="#E6E6E6" stroke="#526173"/>
<text x="606" y="622" font-size="16" font-weight="bold">Future MCP integration</text>
<text x="606" y="645" font-size="13">Live delays, vehicle positions and service alerts</text>
<text x="40" y="710" font-size="18" font-weight="bold">Shared rules and limits</text>
<text x="40" y="741" font-size="15">Consider all same-name platforms; ask only for missing details; enforce Poznań scope.</text>
<text x="40" y="768" font-size="15">Scheduled journeys use same-stop-ID transfers; no live delays or walking transfers.</text>
<text x="40" y="795" font-size="15">Venue research and multi-person meeting comparisons are assistant workflows, not dedicated MCP tools.</text>
<text x="40" y="833" font-size="14">Green: implemented MCP     Blue: assistant + other sources     Grey: future integration</text>
</g></svg>
